name: Python syntax check

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile application modules
        run: python -m py_compile streamlit_app.py streamer_dashboard.py admin_users.py radar.py feedback_hub.py streamdex_suite.py streamdex_security.py beta_apply.py downloads.py planner.py creator_profile.py legacy.py clips_manager.py community_events.py tests/test_security.py

      - name: Run security regression tests
        run: python -m unittest discover -s tests -v

name: Python syntax check

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile application modules
        run: python -m py_compile streamlit_app.py streamer_dashboard.py beta_apply.py downloads.py planner.py creator_profile.py

name: Python checks and regression tests

on:
  push:
    branches: [main, feat/streamdex-suite]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile application modules
        run: python -m py_compile streamlit_app.py streamer_dashboard.py shop.py onboarding.py admin_users.py radar.py feedback_hub.py streamdex_suite.py beta_apply.py downloads.py planner.py creator_profile.py legacy.py clips_manager.py community_events.py
      - name: Run regression tests (mocked Twitch and Firebase)
        run: python -m pytest -q
